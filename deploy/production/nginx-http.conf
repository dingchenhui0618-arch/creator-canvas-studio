# HTTP 阶段的外壳（证书还没签下来之前）：只跑应用，不做跳转。
# 由 deploy/production/render-vhost.sh 渲染；应用段在 nginx-app.conf 里，这里不写 location
# （除了 ACME 续期那一条）。
server {
    listen __HTTP_PORT__;
    server_name __DOMAIN__;

    # 签发 / 续期走这里，别被跳转吃掉
    location /.well-known/acme-challenge/ {
        root __ACME_DIR__;
    }

    include __APP_CONF__;
}
