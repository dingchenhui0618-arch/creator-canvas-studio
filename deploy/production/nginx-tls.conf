# HTTPS 阶段的外壳：80 只留 ACME + 跳转，443 跑应用。
# 由 deploy/production/render-vhost.sh 渲染；应用段在 nginx-app.conf 里，这里不写 location
# （除了 ACME 和那条 301）。
server {
    listen __HTTP_PORT__;
    server_name __DOMAIN__;

    # 续期走这里，别被跳转吃掉
    location /.well-known/acme-challenge/ {
        root __ACME_DIR__;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include __APP_CONF__;
}
