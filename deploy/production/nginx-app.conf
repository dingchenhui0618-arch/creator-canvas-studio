# VisionQA 的应用段 vhost：唯一写着 location 的文件。
#
# 为什么单独一份：install.sh（证书还没签下来的 HTTP 阶段）和 enable-https.sh（签完证书之后）
# 需要一模一样的应用配置。以前两处各自内联一整套 vhost，2026-11-14 复查时发现漂移——
# 线上手改过的私有图 ^~ 覆盖、/print/、安全头从来没回到脚本里：谁重跑一次部署脚本，
# 自己上传的图就又会变回「7 天 public 缓存」，打印页也会掉回 SPA 的 index.html。
# 现在只留这一份，两个脚本把自己的外壳 include 进来；缺一个 location 或少一个安全头，
# scripts/check-nginx.mjs 会直接报错（npm test 里跑）。
#
# 渲染后落到 /etc/nginx/conf.d/<域名>.app.inc —— 后缀必须是 .inc，不能是 .conf：
# conf.d/*.conf 是在 http 层被 include 的，一个带 location 的片段放在那里，
# nginx -t 会直接报「location directive is not allowed here」（2026-11-14 第一次渲染就撞到，被 nginx -t 挡住）。
#
# 占位符（由 deploy/production/render-vhost.sh 替换）：
#   __APP_DIR__  __API_PORT__  __ACCESS_LOG__

server_tokens off;

root __APP_DIR__/dist;
# 有边缘访问日志格式就照写，没有就关掉（写一个不存在的格式名会让 nginx -t 直接失败）
access_log __ACCESS_LOG__;
client_max_body_size 64m;
index index.html;

# 安全头（HSTS / nosniff / 防嵌套）。注意：某个 location 里一旦写了 add_header，
# 本块这几行对它就不再生效，所以下面每个写了 add_header 的 location 都整套重复了一遍。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 入口 HTML 绝不缓存：否则发版后浏览器还会用旧 index.html 里的旧 bundle。
location = /index.html {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
}

# 带内容 hash 的产物长缓存，发版换文件名即可失效
location /assets/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_http_version 1.1;
    # 这条 location 不写 add_header：让它继承上面整套安全头（写了就只剩自己那一份）。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 用真实对端 IP，不要 $proxy_add_x_forwarded_for：那会把客户端自带的 XFF 拼在前面。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# 自己传的图（v0.9.87）：只给本人看，缓存头由应用给（private + ETag）；
# 不能落到下面的 /media/ 块——那里给模板帧加了 7 天 public 缓存，私有图不能跟着公开。
location ^~ /media/uploads/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# 模板帧图（v0.9.88）：这条现在要登录、只认自己看得见的模板，缓存头也由应用给（private）；
# 不能落到下面的 /media/ 块——那里给帧图加了 7 天 public 缓存，会把私有画面写进中间层。
location ^~ /media/frames/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# 其余 /media/：模板帧的公开缩略图这类可以长缓存（^~ 的两条私有目录走不到这里）。
location /media/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_set_header Host $host;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=604800";
}

# 交付稿打印版（A4 纸）：服务端出的 HTML，必须走 Node，不能落到下面的静态 try_files
location ^~ /print/ {
    proxy_pass http://127.0.0.1:__API_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
