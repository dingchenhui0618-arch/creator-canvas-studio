# =============================================================================
# VisionQA Workbench —— nginx 生产反代（与 deploy/Caddyfile 等价）
#
# 本文件按 nginx 的上下文分三段，不要整段丢进一个文件：
#
#   第 1 段（http 上下文）   → 只放一次。粘到 /etc/nginx/nginx.conf 的 http { } 里，
#                              或存成 /etc/nginx/conf.d/00-vq-http.conf（conf.d 里的
#                              文件已经在 http 上下文，但 upstream / gzip /
#                              limit_req_zone 必须写在这一层）
#   第 2 段（80 端口）       → 与应用一起放 /etc/nginx/conf.d/vq.conf
#   第 3 段（443 端口）      → 同上。证书路径见第 3 段开头的两种做法
#
# 顺序建议：先只放第 2 段 → certbot certonly --webroot 拿证书 → 再加第 3 段。
# 校验：sudo nginx -t     生效：sudo systemctl reload nginx
#
# 前提：DNS 的 A 记录（有 IPv6 就再加 AAAA）指向本机，80/443 入站放行。
# 为什么反代：server/index.mjs 写死 listen(port, '127.0.0.1')，本就不接受外网直连。
# 本文件不含任何密钥。密钥只放在 /etc/visionqa/env。
# =============================================================================


# =============================================================================
# 第 1 段：http 上下文（只放一次）
# =============================================================================

# 上游：本机 Node 单进程
upstream vq_app {
    server 127.0.0.1:8787 max_fails=3 fail_timeout=10s;
    keepalive 16;                # 配合 proxy_http_version 1.1 复用连接
}

# 压缩：前端产物 635KB JS + 189KB CSS（实测），压缩收益明显
gzip on;
gzip_vary on;
gzip_comp_level 5;               # 5 已接近 6 的压缩率，CPU 更低
gzip_min_length 1024;
gzip_proxied any;                # 上游是 Node 直接返回的，必须 any 才会压缩
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml;

# 限流：给 /api/ 用，默认不启用（见第 3 段 location /api/ 里的注释）
limit_req_zone $binary_remote_addr zone=vq_api:10m rate=20r/s;

# 访问日志：JSON 一行一条，便于 grep 与导入
log_format vq_json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr",'
    '"m":"$request_method","u":"$request_uri","s":$status,'
    '"b":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';


# =============================================================================
# 第 2 段：80 端口（ACME 验证 + 全量跳 HTTPS）
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name vq.example.com;

    # certbot --webroot 的验证目录，必须放在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# 第 3 段：443 正式服务
#
# 证书来源二选一：
#   A) sudo certbot certonly --webroot -w /var/www/certbot -d vq.example.com
#      → ssl_certificate 用 /etc/letsencrypt/live/vq.example.com/ 下的文件（下面已写好）
#   B) 删掉下面 ssl_certificate / ssl_certificate_key 两行，改用
#      sudo certbot --nginx -d vq.example.com，让 certbot 自己注入证书配置
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # nginx >= 1.25.1；老版本改成 listen 443 ssl http2;

    server_name vq.example.com;
    server_tokens off;           # 不暴露 nginx 版本号

    ssl_certificate     /etc/letsencrypt/live/vq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vq.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # 不要留 TLSv1.0 / 1.1
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- 安全头 ----
    # 注意：任一 location 里出现 add_header，本 server 块的 add_header 就不再生效；
    #      那种情况下要把下面几行复制进那个 location。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # 上传上限：复刻接口要收原始视频，后端 MAX_VIDEO_MB 默认 160，这里留余量
    client_max_body_size 200m;

    # ---- 反代公共头 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # 用 $remote_addr 而不是 $proxy_add_x_forwarded_for：后端按 X-Forwarded-For 的
    # 第一个值做登录失败限流（server/auth.mjs 的 clientIp），而 $proxy_add_x_forwarded_for
    # 会保留客户端自己伪造的头，攻击者换个假 IP 就能绕开限流。单层反代下直接用真实对端 IP。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";      # 配合 upstream keepalive
    proxy_connect_timeout 5s;
    # 复刻 90–180s、视觉评审 60–85s、智能体 20–50s（实测），读超时必须放宽
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/health {
        proxy_pass http://vq_app;
        access_log off;          # 监控每 30s 打一次，不必留痕
        # 不想让公网看到依赖状态（redfox / vision 是否已配置）时，二选一：
        #   A) 只允许内网/监控访问：
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;
        #   B) 干脆不给公网（云监控走内网时选这个）：
        # return 403;
    }

    location /api/ {
        # 需要防刷时取消下一行：20r/s + burst 40 足够单人操作，批量脚本会被限住
        # limit_req zone=vq_api burst=40 nodelay;
        proxy_pass http://vq_app;
    }

    # 抽帧图片：后端已按扩展名下长缓存头，这里只放行
    location /media/ {
        proxy_pass http://vq_app;
    }

    # 入口 HTML 不缓存：否则发版后浏览器继续用旧 index.html 里的旧 bundle。
    # 线上实际是 nginx 直接托管 /opt/visionqa/dist（不反代静态），这条规则在两种形态下都要有。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # 带内容 hash 的产物长缓存，发版换文件名即可失效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端 SPA：未知路径由 Node 的 serveFile 兜底回 dist/index.html
    location / {
        proxy_pass http://vq_app;
    }

    access_log /var/log/nginx/vq-access.log vq_json;
    error_log  /var/log/nginx/vq-error.log warn;
}
