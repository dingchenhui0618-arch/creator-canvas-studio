# VisionQA 所在机器的 journald 上限（C4 日志保留策略的一部分）
# 项目自己的日志走 data/logs（按天轮转 + 保留天数，见 server/log-files.mjs）；
# 这里只管 systemd 收集的 stdout/stderr，给整机一个硬上限，避免 journal 无限长大。
#
# 安装：cp deploy/journald-visionqa.conf /etc/systemd/journald.conf.d/visionqa.conf
#       systemctl restart systemd-journald && journalctl --disk-usage
[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
